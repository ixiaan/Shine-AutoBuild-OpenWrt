name: Build_amd64_sekisui

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

# 删除工作流运行需要 actions: write，发布/删除 release 需要 contents: write
permissions:
  actions: write
  contents: write

env:
  # 控制“删除旧 release”步骤是否执行
  UPLOAD_RELEASE: 'true'

jobs:
  build:
    # ubuntu-latest 将于 2026-10-19 起逐步迁移到 Ubuntu 26.04（BREAKING CHANGES），
    # 先固定 24.04 保持构建稳定；验证 26.04 兼容后可改回 ubuntu-latest 或 ubuntu-26.04
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true  

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        FEEDS_CONF: feeds_config/my.feeds.conf.default
      run: |
        echo "FIRMWARE_VERSION=$(date +"%y%m%d-%H")" >> $GITHUB_ENV
        echo "START_DATE=$(date +'%Y年%m月%d日 %H点%M分%S秒')" >> $GITHUB_ENV
        set +e
        docker rmi `docker images -q`
        echo "Deleting files, please wait ..."
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /etc/mysql \
          /etc/php
        sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev qemu-img  
        sudo -E apt-get -y install libncurses-dev zlib1g-dev gawk
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone source code
      env: 
        REPO_URL: https://github.com/coolsnowwolf/lede
        REPO_BRANCH: master
        FEEDS_CONF: feeds_config/my.feeds.conf.default
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        [ -e $FEEDS_CONF ] && cp -r $FEEDS_CONF openwrt/feeds.conf.default
        cd openwrt
        
        
    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
        sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/luci/bin/config_generate
        sed -i 's/255.255.255.0/255.255.254.0/g' package/base-files/files/bin/config_generate
        sed -i 's/255.255.255.0/255.255.254.0/g' package/base-files/luci/bin/config_generate
        sed -i "s/hostname='OpenWrt'/hostname='Sekisui'/g" package/base-files/files/bin/config_generate
        sed -i "s/hostname='LEDE'/hostname='Sekisui'/g" package/base-files/luci/bin/config_generate
        sed -i "s/DISTRIB_DESCRIPTION=.*/DISTRIB_DESCRIPTION='OpenWrt By AnnShine $(date +"%Y%m%d")'/g" package/base-files/files/etc/openwrt_release
        cat package/base-files/files/bin/config_generate
        cat package/base-files/luci/bin/config_generate

    #- name: Import external feeds - passwall
    #  working-directory: ./openwrt
    #  run: |
    #    git clone https://github.com/xiaorouji/openwrt-passwall.git package/lienol
    #    git clone "your_github_link" package/"your_folder_name"      

    #- name: Import external feeds - JerryKuKu Argon
    #  working-directory: ./openwrt
    #  run: |
    #    git clone -b 18.06 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon-jerrykuku
    - name: More App
      run: |
        cd openwrt
        # xray-core / mosdns 需要新版 golang，替换 feeds 自带的
        # xray-core 26.9.9 的 go.mod 要求 go >= 1.27，26.x 分支是 go1.26.8，必须升到 27.x（go1.27.1）
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 27.x feeds/packages/lang/golang
        # mosdns + v2ray-geodata（非官方源处理方式：先删自带再克隆）
        find ./ | grep Makefile | grep v2ray-geodata | xargs rm -f
        find ./ | grep Makefile | grep mosdns | xargs rm -f
        git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
        git clone https://github.com/sbwml/v2ray-geodata package/v2ray-geodata
        # argon 主题配置（Lean's LEDE 版）
        rm -rf ./package/lean/luci-app-argon-config
        git clone -b 18.06 https://github.com/jerrykuku/luci-app-argon-config.git ./package/lean/luci-app-argon-config
        # tailscale 暂时停用
        # sed -i '/\/etc\/init\.d\/tailscale/d;/\/etc\/config\/tailscale/d;' feeds/packages/net/tailscale/Makefile
        # git clone https://github.com/asvow/luci-app-tailscale package/luci-app-tailscale
        # passwall 通过 feeds 安装（feeds.conf.default 顶部已添加 passwall_packages / passwall_luci），无需在此克隆

    - name: Configuration Customization - Build_x86_64
      env:
        CONFIG_FILE: 'sekisui.config'
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        # chmod +x ./customize.sh && ./customize.sh
        cd openwrt && make defconfig
        
    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name : Upload artifact
      uses: actions/upload-artifact@master
      with:
        name: OpenWrt
        path: openwrt/bin/targets/x86/64



    - name: Organize firmware
      id: organize
      run: |
        # 整理固件包时候,删除您不想要的固件或者文件,让它不需要上传到Actions空间
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf version.buildinfo
        rm -rf profiles.json
        rm -rf *kernel*
        rm -rf *.manifest
        rm -rf sha256sums
        mv *rootfs.img.gz ${{ env.FIRMWARE_VERSION }}-Sekisui-openwrt-x86-64-generic-squashfs-rootfs.img.gz
        mv *combined-efi.img.gz ${{ env.FIRMWARE_VERSION }}-Sekisui-openwrt-x86-64-generic-squashfs-combined-efi.img.gz
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to artifact
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FIRMWARE_VERSION }}-OpenWrt-Sekisui-amd64
        path: ${{ env.FIRMWARE }}

    - name: Create release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        release_tag="${{ env.FIRMWARE_VERSION }}-OpenWrt-Sekisui-amd64"
        echo "编译时间：$(date +'%Y年%m月%d日 %H点%M分')" >> release.txt
        echo "默认网关：192.168.10.1" >> release.txt
        echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ env.FIRMWARE_VERSION }}-OpenWrt-Sekisui-amd64
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

   

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 600
        keep_minimum_runs: 30

    - name: Delete old releases
      uses: actions/github-script@v8
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const keepLatest = 30;
          const { owner, repo } = context.repo;
          const releases = await github.paginate(
            github.rest.repos.listReleases,
            { owner, repo, per_page: 100 }
          );
          // 按发布时间从新到旧排序，只保留最新的 keepLatest 个，其余连同 tag 一起删除
          const toDelete = releases
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(keepLatest);
          for (const release of toDelete) {
            core.info(`删除 release: ${release.tag_name}`);
            await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            if (release.tag_name) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                core.warning(`删除 tag 失败 ${release.tag_name}: ${error.message}`);
              }
            }
          }
          core.info(`完成，共保留 ${Math.min(keepLatest, releases.length)} 个 release`);
